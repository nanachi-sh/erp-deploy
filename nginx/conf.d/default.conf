server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    ssl_reject_handshake on;
    server_name erp.lan;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # 后端接口：保留 /api 前缀（后端注册的路由组就是 /api）
    # ^~ 表示命中该前缀后不再检查后续正则；否则 /api/.../avatar.png 会被下面的
    # 图片正则截走，直接 404。
    location ^~ /api/ {
        # proxy_pass 用变量时 nginx 才会在请求时解析 DNS；
        # 否则启动时只解析一次，main 重建换 IP 后会一直 502。
        resolver 127.0.0.11 valid=10s;
        resolver_timeout 5s;
        set $backend http://main:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 追加真实客户端 IP；main 的 trusted_proxies 必须包含 172.28.0.0/16
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # 带内容哈希的构建产物（vben 产物在 js/、css/、jse/ 下），可长期缓存。
    # 只用 add_header 写完整 Cache-Control：expires 也会输出一条 Cache-Control，
    # 两者叠加会变成两个响应头。
    location ~* ^/(?:js|css|jse|assets)/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 图片与字体
    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # 入口 HTML 与运行时配置不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /_app.config.js {
        add_header Cache-Control "no-cache";
    }

    # SPA 回退（当前前端使用 hash 路由，仍保留此配置以兼容后续改动）
    location / {
        try_files $uri $uri/ /index.html;
    }
}